packages:
  - packages/*
  - examples/*
  - fixtures/*

# One pinned version per shared tool, referenced as `catalog:` in each package.
catalog:
  "@arethetypeswrong/cli": 0.18.5
  "@biomejs/biome": 2.5.15
  "@cloudflare/vitest-pool-workers": 0.23.0
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  jsdom: 30.1.2
  next: 16.4.0
  publint: 0.3.25
  react: 19.3.0
  husky: 9.1.7
  react-dom: 19.3.0
  server-only: 0.0.1
  tsdown: 0.23.0
  typescript: ~6.0.3
  vitest: ~4.1.11

# Only these dependencies may run install scripts (workerd for the Workers test pool).
allowBuilds:
  esbuild: true
  workerd: true
